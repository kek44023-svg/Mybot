<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဗီဒီယို ကြည့်ရှုရန်</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #0f172a; 
            color: #fff; 
            text-align: center; 
            padding: 30px 15px; 
            margin: 0;
        }
        .box { 
            background: #1e293b; 
            padding: 25px 15px; 
            border-radius: 12px; 
            display: inline-block; 
            max-width: 450px; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #38bdf8; font-size: 20px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; }
        .btn { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
            margin: 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center;
        }
        .btn:hover { background: #2563eb; }
        .hidden { display: none; }
        .timer-box { font-size: 16px; color: #facc15; margin: 15px 0; font-weight: bold; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; }
        .banner-ad { margin: 15px 0; overflow: hidden; display: flex; justify-content: center; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🎥 ဗီဒီယို ကြည့်ရှုရန်</h2>
        <p id="instruction">ကျေးဇူးပြု၍ အောက်ပါကြော်ငြာကို နှိပ်ပြီး ခဏစောင့်ပါ...</p>
        
        <!-- Banner Ad -->
        <div class="banner-ad">
            <ins style="display:inline-block;width:100%;max-width:728px;height:90px" data-width="728" data-height="90" class="p075ea45c3b" data-domain="//data527.click" data-affquery="/67738143bce571a1cfc2/075ea45c3b/?placementName=default"></ins>
            <script src="//data527.click/js/responsive.js" async></script>
        </div>

        <!-- Timer -->
        <div id="timer-box" class="timer-box">
            ⏳ ကြော်ငြာခလုတ် ပေါ်လာရန် <span id="countdown">10</span> စက္ကန့် စောင့်ပါ...
        </div>

        <!-- Ad Button -->
        <a id="ad-btn" href="https://data527.click/4a3bc8b30585b0196767/34c8a2d139/?placementName=default" target="_blank" class="btn hidden" onclick="unlockVideo()">
            👉 ဤနေရာကိုနှိပ်၍ ကြော်ငြာကြည့်ပါ (Ads)
        </a>

        <!-- Video Container -->
        <div id="video-container" class="hidden">
            <p style="color: #22c55e; font-weight: bold;">✅ အောင်မြင်ပါသည်။ ဗီဒီယို စတင်ကြည့်ရှုနိုင်ပါပြီ -</p>
            <video id="main-video" controls controlsList="nodownload">
                <source id="video-source" src="" type="video/mp4">
                သင့်ဘရောက်ဆာသည် ဗီဒီယိုကို မပံ့ပိုးပါ။
            </video>
        </div>
    </div>

    <!-- Script Ad -->
    <script type="text/javascript" src="//data527.click/cefe12b354cc83ecd966/38b30e8028/?placementName=default"></script>

    <script>
        // URL ထဲက ဗီဒီယိုလင့်ခ် (v parameter) ကို ဖမ်းယူခြင်း
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v');

        if (videoUrl) {
            document.getElementById('video-source').src = decodeURIComponent(videoUrl);
            document.getElementById('main-video').load();
        }

        var timeLeft = 10;
        var countdownEl = document.getElementById('countdown');
        var timerBox = document.getElementById('timer-box');
        var adButton = document.getElementById('ad-btn');

        var downloadTimer = setInterval(function() {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(downloadTimer);
                timerBox.style.display = 'none';
                adButton.classList.remove('hidden');
            }
        }, 1000);

-       function unlockVideo() {
            setTimeout(function() {
                document.getElementById('instruction').style.display = 'none';
                adButton.style.display = 'none';
                document.getElementById('video-container').classList.remove('hidden');
            }, 1000);
        }
    </script>
</body>
</html>
