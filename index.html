<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဗီဒီယိုကြည့်ရန် - Smart Hub</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #0f172a; 
            color: #fff; 
            text-align: center; 
            padding: 30px 15px; 
            margin: 0;
        }
        .box { 
            background: #1e293b; 
            padding: 25px 15px; 
            border-radius: 12px; 
            display: inline-block; 
            max-width: 450px; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #38bdf8; font-size: 20px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; }
        a.btn { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
            margin: 15px 0; 
            width: 100%; 
            box-sizing: border-box;
        }
        a.btn:hover { background: #2563eb; }
        .hidden { display: none; }
        .timer-box { font-size: 16px; color: #facc15; margin: 15px 0; font-weight: bold; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🎥 ဗီဒီယို ကြည့်ရှုရန်</h2>
        <p id="instruction">ကျေးဇူးပြု၍ အောက်ပါကြော်ငြာကို နှိပ်ပြီး ခဏစောင့်ပါ...</p>
        
        <!-- စက္ကန့် ၁၀ စောင့်ရမည့် Timer -->
        <div id="timer-box" class="timer-box">
            ⏳ ကြော်ငြာလင့်ခ် ပေါ်လာရန် <span id="countdown">10</span> စက္ကန့် စောင့်ပါ...
        </div>

        <!-- လင့်ခ် ၄ ခုထဲမှ တစ်ခု အလှည့်ကျပေါ်မည့် ကြော်ငြာခလုတ် -->
        <a id="ad-btn" href="#" target="_blank" class="btn hidden" onclick="startViewingTimer()">
            👉 ဤနေရာကိုနှိပ်၍ ကြော်ငြာကြည့်ပါ (Ads)
        </a>

        <!-- စက္ကန့် ၁၀ ပြည့်ပြီး ကြော်ငြာကြည့်ပြီးမှ ပေါ်လာမည့် ဗီဒီယို Player -->
        <div id="video-container" class="hidden">
            <p style="color: #22c55e; font-weight: bold;">✅ အောင်မြင်ပါသည်။ ဗီဒီယို စတင်ကြည့်ရှုနိုင်ပါပြီ -</p>
            <video id="main-video" controls controlsList="nodownload">
                <source src="YOUR_REAL_VIDEO_MP4_URL.mp4" type="video/mp4">
                သင့်ဘရောက်ဆာသည် ဗီဒီယိုကို မပံ့ပိုးပါ။
            </video>
        </div>
    </div>

    <script>
        // ပေးထားသည့် ကြော်ငြာလင့်ခ် ၄ ခုစာရင်း
        const allAdLinks = [
            "https://www.profitableratecpmnetwork.com/b78gy7qz2?key=6211da8bfcdaec886f63c404d0f4a951",
            "https://www.profitableratecpmnetwork.com/vc78z4qjs6?key=dd8859e6972c4ed6f238cb73ca2ac340",
            "https://auctionr.org/4/7e959604b859da85f8904c4de57d3b7d",
            "https://auctionr.org/4/eddc6695e1715ccf6cebce8f9f3325b7"
        ];

        // လင့်ခ်များကို အလှည့်ကျ ရွေးချယ်ပေးရန်
        function getRandomAd() {
            const randomIndex = Math.floor(Math.random() * allAdLinks.length);
            return allAdLinks[randomIndex];
        }

        document.getElementById('ad-btn').href = getRandomAd();

        let timeLeft = 10; // ၁၀ စက္ကန့်
        const countdownEl = document.getElementById('countdown');
        const timerBox = document.getElementById('timer-box');
        const adBtn = document.getElementById('ad-btn');

        // စက္ကန့် ၁၀ စက္ကန့်ရေတွက်ခြင်း
        let timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                timerBox.style.display = 'none';
                adBtn.classList.remove('hidden'); // ခလုတ်ပေါ်လာမည်
            }
        }, 1000);

        // အသုံးပြုသူက ကြော်ငြာခလုတ်ကို နှိပ်ပြီးသွားသောအခါ ဗီဒီယို ပေါ်လာစေရန်
        function startViewingTimer() {
            setTimeout(() => {
                document.getElementById('instruction').style.display = 'none';
                adBtn.style.display = 'none';
                document.getElementById('video-container').classList.remove('hidden');
            }, 1500);
        }
    </script>
</body>
</html>
