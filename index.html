<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Ad Player</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- 1. Social Bar Ad Script (Header ထဲတွင် ထည့်သွင်းထားသည်) -->
    <script type="text/javascript" src="//cdn-server.live/ebbfab0980c21524dec0/58468e6bb4/?placementName=default" async></script>

    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            padding: 15px; 
            background: #111; 
            color: #fff; 
            margin: 0;
        }
        .hidden { display: none; }
        #timer-box { margin: 15px 0; }
        #timer { font-size: 28px; color: #ffcc00; font-weight: bold; }
        .btn { 
            background: #28a745; 
            color: white; 
            padding: 14px 24px; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            font-weight: bold;
            width: 100%;
            max-width: 300px;
        }
        .btn:active { background: #218838; }
        .ad-banner-box {
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h2>🎥 ဗီဒီယိုကြည့်ရှုရန်</h2>
    <p>ကြော်ငြာကို ၁၅ စက္ကန့် စောင့်ဆိုင်းပေးပါ...</p>
    
    <div id="timer-box">
        ကျန်ရှိချိန်: <span id="timer">15</span> စက္ကန့်
    </div>

    <!-- 2. Banner Ad (300x600 Banner) -->
    <div class="ad-banner-box">
        <ins style="display:inline-block;width:300px;height:600px" data-width="300" data-height="600" class="n041ce4af46" data-domain="//data527.click" data-affquery="/c7e4b264afcc3cec8b4a/041ce4af46/?placementName=default"></ins>
        <script src="//data527.click/js/responsive.js" async></script>
    </div>

    <!-- အချိန်ပြည့်မှ ပေါ်လာမည့် ဗီဒီယိုဖွင့်ရန် ခလုတ် (Smartlink ဖြင့် ချိတ်ဆက်ထားသည်) -->
    <div id="action-box" class="hidden" style="margin-top: 25px; margin-bottom: 30px;">
        <button class="btn" onclick="openVideo()">ဗီဒီယိုဖွင့်မည် ▶️</button>
    </div>

    <script>
        let timeLeft = 15;
        let tg = window.Telegram.WebApp;
        tg.expand(); // Mini ကို အပြည့်ချဲ့ရန်

        let countdown = setInterval(function() {
            timeLeft--;
            document.getElementById('timer').innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdown);
                document.getElementById('timer-box').style.display = 'none';
                document.getElementById('action-box').classList.remove('hidden');
            }
        }, 1000);

        function openVideo() {
            // 3. Smartlink (၁၅ စက္ကန့်ပြည့်ပြီး ခလုတ်နှိပ်မှ Smartlink သို့ သွားမည်)
            const smartLinkURL = "https://data527.click/4a3bc8b30585b0196767/c274c56a98/?placementName=default";
            
            // User ကို Smartlink သို့ ပို့မည် (သို့မဟုတ် New Tab ဖြင့် ဖွင့်မည်)
            window.open(smartLinkURL, '_blank');
            
            // လိုအပ်ပါက Telegram Web App ကို ပိတ်ရန် (tg.close() သုံးနိုင်သည်)
            // tg.close();
        }
    </script>
</body>
</html>
