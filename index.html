<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဗီဒီယို ကြည့်ရှုရန်</title>
    <style>
        body { 
            font-family: sans-serif; 
            background: #0f172a; 
            color: #fff; 
            text-align: center; 
            padding: 30px 15px; 
            margin: 0;
        }
        .box { 
            background: #1e293b; 
            padding: 25px 15px; 
            border-radius: 12px; 
            display: inline-block; 
            max-width: 450px; 
            width: 100%; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 { color: #38bdf8; font-size: 20px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 14px; }
        .btn { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 8px; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
            margin: 15px 0; 
            width: 100%; 
            box-sizing: border-box;
            text-align: center;
        }
        .btn:hover { background: #2563eb; }
        .hidden { display: none; }
        .timer-box { font-size: 16px; color: #facc15; margin: 15px 0; font-weight: bold; }
        video { width: 100%; border-radius: 8px; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="box">
        <h2>🎥 ဗီဒီယို ကြည့်ရှုရန်</h2>
        <p id="instruction">ကျေးဇူးပြု၍ အောက်ပါကြော်ငြာကို နှိပ်ပြီး ခဏစောင့်ပါ...</p>
        
        <!-- ၁၀ စက္ကန့် တိုင်ပ်မာ -->
        <div id="timer-box" class="timer-box">
            ⏳ ကြော်ငြာခလုတ် ပေါ်လာရန် <span id="countdown">10</span> စက္ကန့် စောင့်ပါ...
        </div>

        <!-- ကြော်ငြာခလုတ် (JavaScript ဖြင့် လင့်ခ်အလိုအလျောက် ချိတ်မည်) -->
        <a id="ad-btn" href="#" target="_blank" class="btn hidden" onclick="unlockVideo()">
            👉 ဤနေရာကိုနှိပ်၍ ကြော်ငြာကြည့်ပါ (Ads)
        </a>

        <!-- ဗီဒီယိုပြမည့် နေရာ -->
        <div id="video-container" class="hidden">
            <p style="color: #22c55e; font-weight: bold;">✅ အောင်မြင်ပါသည်။ ဗီဒီယို စတင်ကြည့်ရှုနိုင်ပါပြီ -</p>
            <video id="main-video" controls controlsList="nodownload">
                <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
                သင့်ဘရောက်ဆာသည် ဗီဒီယိုကို မပံ့ပိုးပါ။
            </video>
        </div>
    </div>

    <script>
        // ပေးထားသည့် ကြော်ငြာလင့်ခ် ၄ ခု
        var adLinks = [
            "https://www.profitableratecpmnetwork.com/b78gy7qz2?key=6211da8bfcdaec886f63c404d0f4a951",
            "https://www.profitableratecpmnetwork.com/vc78z4qjs6?key=dd8859e6972c4ed6f238cb73ca2ac340",
            "https://auctionr.org/4/7e959604b859da85f8904c4de57d3b7d",
            "https://auctionr.org/4/eddc6695e1715ccf6cebce8f9f3325b7"
        ];

        // ကျပန်း (Random) လင့်ခ်တစ်ခု ရွေးထုတ်ခြင်း
        var randomIndex = Math.floor(Math.random() * adLinks.length);
        var selectedAd = adLinks[randomIndex];

        // ခလုတ်ထဲသို့ လင့်ခ်ထည့်ခြင်း
        var adButton = document.getElementById('ad-btn');
        adButton.href = selectedAd;

        var timeLeft = 10;
        var countdownEl = document.getElementById('countdown');
        var timerBox = document.getElementById('timer-box');

        // ၁၀ စက္ကန့် ရေတွက်ခြင်း
        var downloadTimer = setInterval(function() {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(downloadTimer);
                timerBox.style.display = 'none';
                adButton.classList.remove('hidden'); // ခလုတ်ပေါ်လာစေရန်
            }
        }, 1000);

        // ကြော်ငြာခလုတ်ကို နှိပ်လိုက်သောအခါ ဗီဒီယိုပေါ်လာစေရန်
        function unlockVideo() {
            setTimeout(function() {
                document.getElementById('instruction').style.display = 'none';
                adButton.style.display = 'none';
                document.getElementById('video-container').classList.remove('hidden');
            }, 1000);
        }
    </script>
</body>
</html>
